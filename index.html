<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>瞬間英作文トレーニング</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --mic: #7c3aed;
      --ok: #16a34a;
      --mid: #d97706;
      --ng: #dc2626;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h1 { font-size: 18px; margin: 0; }
    .stats { display: flex; gap: 6px; font-size: 12px; font-weight: 700; }
    .badge { padding: 3px 8px; border-radius: 999px; background: #e2e8f0; }
    .badge.ok { background: #dcfce7; color: var(--ok); }
    .badge.mid { background: #fef3c7; color: var(--mid); }
    .badge.ng { background: #fee2e2; color: var(--ng); }

    /* 初回URL設定ボックス */
    .setup-box {
      background: #eff6ff;
      border: 2px solid #93c5fd;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      display: none;
    }
    .setup-box.show { display: block; }
    .setup-title { font-weight: 700; font-size: 15px; color: var(--primary-dark); margin-bottom: 6px; }
    .setup-desc { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 10px; }
    .setup-input {
      width: 100%;
      padding: 10px;
      border: 1.5px solid #93c5fd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 8px;
      background: #fff;
    }
    .setup-msg { font-size: 13px; font-weight: 700; color: var(--ng); margin-top: 8px; line-height: 1.4; }

    .top-actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr 0.8fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.05s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-mic { background: var(--mic); color: #fff; }
    .btn-mic.running { background: var(--ng); }
    .btn-auto { background: #0f172a; color: #fff; }
    .btn-auto.running { background: var(--ng); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-sub { background: #e2e8f0; color: var(--text); padding: 10px 12px; font-size: 13px; }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .jp-text {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.45;
      word-break: break-word;
    }
    .timer-bar-wrap {
      height: 7px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.08s linear, background-color 0.2s;
    }
    .timer-bar.paused { background: var(--mic); }

    .mic-box {
      background: #f5f3ff;
      border: 1.5px solid #ddd6fe;
      border-radius: 12px;
      padding: 12px 14px;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .mic-box.correct { background: #f0fdf4; border-color: #86efac; }
    .mic-box.wrong { background: #fef2f2; border-color: #fca5a5; }
    .mic-status {
      font-size: 12px;
      font-weight: 700;
      color: var(--mic);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mic-box.correct .mic-status { color: var(--ok); }
    .mic-box.wrong .mic-status { color: var(--ng); }
    .transcript-text {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      min-height: 26px;
      line-height: 1.4;
      word-break: break-word;
    }
    .transcript-placeholder { color: #94a3b8; font-weight: 400; font-size: 14px; }

    .answer-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      min-height: 74px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
    }
    .en-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-dark);
      line-height: 1.45;
      display: none;
    }
    .en-text.show { display: block; }
    .answer-placeholder { color: var(--muted); font-size: 14px; text-align: center; }

    .audio-row { display: flex; gap: 8px; }
    .judge-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-ok { background: var(--ok); color: #fff; }
    .btn-mid { background: var(--mid); color: #fff; }
    .btn-ng { background: var(--ng); color: #fff; }

    details {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }
    summary { font-weight: 700; font-size: 14px; cursor: pointer; }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
      font-size: 13px;
    }
    .setting-item { display: flex; flex-direction: column; gap: 4px; }
    .setting-item.full { grid-column: 1 / -1; }
    select, input[type="number"] {
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
